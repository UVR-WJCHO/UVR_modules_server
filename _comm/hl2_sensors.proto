syntax = "proto3";

// 온디맨드 센서 스트림. HL2SensorPacket(hl2_data.proto) 과 별개 채널이다.
//
// 왜 나눴나: 오디오를 30 Hz PV 프레임에 끼워 넣으면 (a) PV 가 드롭될 때 그 구간 오디오도
// 함께 사라지고, (b) 연속 스트림이 33 ms 단위로 뭉쳐지며, (c) 오디오를 쓰지 않는 기존
// 진입점까지 그 바이트를 받게 된다. comm_hub 는 keyword 별로 큐를 나누므로 따로 두면
// 서로 막지 않는다.
//
// keyword
//   HL2_CONTROL  서버 -> 기기   어떤 스트림을 켤지
//   HL2_AUDIO    기기 -> 서버   오디오 청크
//   HL2_RENDER   기기 -> 서버   AR 레이어 (홀로그램만, 배경 투명)
//   HL2_IMU      기기 -> 서버   (현재 미사용. 아래 HL2Imu 주석 참조)
//
// 시각 규약: 모든 timestamp 는 HL2SensorPacket.timestamp 와 같은 원점·같은 축이다.
// HL2SensorPacket.timestamp 는 Unity Time.time(앱 기동 후 경과 초, float32) 이고,
// 여기의 정수 필드는 나노초다. 초로 보려면 1e9 로 나눈다.

// 서버 -> 기기. 주기적으로 재전송된다(5 s). 기기는 일정 시간 못 받으면 스트림을 놓는다.
message HL2Control {
  bool  send_audio       = 1;
  bool  send_imu         = 2;   // 현재 기기가 무시한다
  int32 imu_rate_divisor = 3;   // 0 또는 1 = 전부. 선택 구현
  bool  send_render      = 4;   // AR 레이어. send_audio 와 독립이다
}

// 기기 -> 서버. 마이크 청크.
//
// 현재 기기 구현: raw PCM int16 little-endian, mono, 16 kHz, 32 ms 청크 (~32 KB/s).
// sample_rate 를 하드코딩하지 말 것 — 기기가 16 kHz 를 열지 못하면 네이티브 레이트로
// 그대로 보낸다(리샘플링은 스펙트럼을 왜곡해 spectral flux 를 망치므로 하지 않는다).
message HL2Audio {
  bytes audio           = 1;
  int32 sample_rate     = 2;   // 이 필드가 진실이다
  int32 channels        = 3;
  int64 start_timestamp = 4;   // 이 청크 첫 샘플의 시각, 나노초
  bool  is_aac          = 5;   // false = raw PCM int16 LE
}

// 기기 -> 서버. 현재 채워지지 않는다. send_imu 는 기기가 파싱만 하고 무시한다.
//
// 대신 서버가 head_pos_*/head_rot_* 를 미분해 쓴다(modules/adaptivemm/headmotion.py).
// 그 값에는 중력이 없으므로 accel_has_gravity=False 여야 한다.
message HL2Imu {
  repeated float accel    = 1;   // xyz * N, flattened
  repeated float gyro     = 2;   // xyz * M, flattened
  repeated int64 accel_ts = 3;   // 샘플별 시각(ns), 길이 N
  repeated int64 gyro_ts  = 4;   // 길이 M
}

// 기기 -> 서버. 전송된 PV 프레임 하나에 대응하는 AR 레이어.
//
// 기기는 PV 를 합성하지 않고 홀로그램만 따로 그려 보낸다. 합성본을 캡처 경로에 넣으면
// 기기의 온디바이스 손 보정이 PV 를 특징점 추적 입력으로 쓰는데 렌더된 스켈레톤을 영상
// 내용으로 읽게 되고, 보정이 오버레이를 움직이면 추적기가 다시 그것을 본다. 레이어를
// 나누면 raw 경로가 그대로 남고 서버가 raw 와 합성본을 둘 다 갖는다.
//
// image_data 와 같은 해상도·같은 격자다(같은 PV 자세와 RGB intrinsics 로 렌더). 리샘플링
// 없이 그대로 겹치면 된다.
//
// 짝짓기는 timestamp 가 유일한 키다. GPU 비동기 읽기 때문에 HL2DATA 보다 1~2 프레임 늦게
// 도착하므로 도착 순서로 짝지으면 안 된다. 기기가 HL2SensorPacket.timestamp 를 그대로
// echo 하므로(재계산 아님) float 비트가 같아 정확히 일치한다.
message HL2Render {
  bytes image     = 1;   // PNG. 홀로그램 화소만 알파가 있고 배경은 (0,0,0,0)
  int32 width     = 2;
  int32 height    = 3;
  float timestamp = 4;   // HL2SensorPacket.timestamp 와 같은 값. 짝짓기 키
  bool  has_alpha = 5;   // 현재 항상 true
}
