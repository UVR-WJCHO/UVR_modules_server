name: metaboj_hotrack
# Full runtime: Linux x86_64/NVIDIA. Use scripts/setup_metaboj_hotrack.py
# to install this file and then build native extensions in this same environment.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip=25.1
  - setuptools=78.1.1
  - wheel=0.45.1
  - cmake=3.31
  - ninja
  - gxx_linux-64=12
  - libgl
  - libglib
  - pip:
      - -r requirements-metaboj_hotrack.txt
variables:
  ATTN_BACKEND: xformers
  SPARSE_ATTN_BACKEND: xformers
  SPARSE_BACKEND: spconv
  SPCONV_ALGO: native
